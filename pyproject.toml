[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-os"
version = "0.1.0"
description = "面向 AI 编码 Agent 的持久化需求工作区编排器。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ai-dev-os = "workspace_orchestrator.product_cli:main"
workspace = "workspace_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.workspace-orchestrator.automation]
verification-commands = [
  ["{python}", "-m", "pytest"],
  ["{python}", "-m", "ruff", "check", "."],
  ["git", "diff", "--check"],
]
