name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-py${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Build distributions
        run: uv build

      - name: Run installed CLI smoke test
        run: uv tool run --isolated --from . ai-dev-os --help

      - name: Run unit and regression tests
        run: uv run --frozen --extra dev python -m pytest -q

      - name: Run Ruff
        run: uv run --frozen --extra dev python -m ruff check .

      - name: Run mypy
        run: uv run --frozen --extra dev python -m mypy src

      - name: Check committed whitespace errors
        run: git show --check --oneline --no-renames HEAD
