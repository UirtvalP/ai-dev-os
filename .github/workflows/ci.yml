name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tested commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-py${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Build distributions
        run: uv build

      - name: Run installed CLI smoke tests
        run: |
          uv tool run --no-cache --isolated --from . ai-dev-os --help
          uv tool run --no-cache --isolated --from . workspace --help
          uv tool run --no-cache --isolated --from . ai-dev-os --version
          uv tool run --no-cache --isolated --from . workspace --version

      - name: Run unit and regression tests
        run: uv run --frozen --extra dev python -m pytest -q

      - name: Run Ruff
        run: uv run --frozen --extra dev python -m ruff check .

      - name: Run mypy
        run: uv run --frozen --extra dev python -m mypy src

      - name: Check committed whitespace errors
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }} HEAD
